<!DOCTYPE html>
<html lang="lv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jauna parole — VĀRDU ZONA</title>
    <meta name="theme-color" content="#0b0f2a" />
    <link rel="stylesheet" href="style.css?v=2026-03-21" />
  </head>
  <body class="auth-page-body">
    <div class="container privacy-container" style="max-width: 420px;">
      <h1>Izvēlēties jaunu paroli</h1>
      <p id="reset-intro">Ievadi jauno paroli (vismaz 6 simboli).</p>
      <form id="reset-form">
        <input type="hidden" id="reset-token" />
        <label for="reset-password">Jaunā parole</label>
        <input
          type="password"
          id="reset-password"
          autocomplete="new-password"
          required
          minlength="6"
          placeholder="Vismaz 6 simboli"
        />
        <label for="reset-password2">Atkārto paroli</label>
        <input
          type="password"
          id="reset-password2"
          autocomplete="new-password"
          required
          minlength="6"
          placeholder="Atkārto jauno paroli"
        />
        <button type="submit" class="btn-primary">Nomainīt paroli</button>
      </form>
      <p id="reset-message" class="error-message" style="color: inherit; display: none;"></p>
      <p class="auth-link-row">
        <a href="index.html">← Atpakaļ uz pierakstīšanos</a>
      </p>
    </div>
    <script>
      const API_BASE = "https://bugats-wordle-server.onrender.com";
      const params = new URLSearchParams(window.location.search);
      const token = params.get("token");
      const tokenEl = document.getElementById("reset-token");
      const form = document.getElementById("reset-form");
      const messageEl = document.getElementById("reset-message");
      const introEl = document.getElementById("reset-intro");
      if (!token) {
        if (introEl) introEl.textContent = "Trūkst atjaunošanas linka. Pieprasi paroles atjaunošanu vēlreiz no pierakstīšanās lapas.";
        if (form) form.style.display = "none";
      } else {
        if (tokenEl) tokenEl.value = token;
      }
      function showMsg(text, isError) {
        if (!messageEl) return;
        messageEl.textContent = text || "";
        messageEl.style.display = text ? "block" : "none";
        messageEl.style.color = isError ? "red" : "green";
      }
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        if (!token) return;
        const p1 = document.getElementById("reset-password").value;
        const p2 = document.getElementById("reset-password2").value;
        if (p1 !== p2) {
          showMsg("Paroles nesakrīt.", true);
          return;
        }
        if (p1.length < 6) {
          showMsg("Parolei jābūt vismaz 6 simbolus garai.", true);
          return;
        }
        showMsg("Saglabā…", false);
        try {
          const res = await fetch(API_BASE + "/password-reset", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token, newPassword: p1 }),
          });
          const data = await res.json().catch(() => ({}));
          if (res.ok) {
            showMsg(data.message || "Parole nomainīta. Vari ienākt.", false);
            form.reset();
            setTimeout(() => { window.location.href = "index.html"; }, 2000);
          } else {
            showMsg(data.message || "Kļūda. Mēģini vēlreiz vai pieprasi jaunu linku.", true);
          }
        } catch (err) {
          showMsg("Nav savienojuma ar serveri. Mēģini vēlreiz.", true);
        }
      });
    </script>
  </body>
</html>
